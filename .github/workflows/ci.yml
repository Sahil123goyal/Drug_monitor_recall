name: Schema checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drug_monitor
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: drug_monitor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drug_monitor -d drug_monitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://drug_monitor:ci_only_password@localhost:5432/drug_monitor_test
      TEST_DATABASE_URL: postgresql+psycopg://drug_monitor:ci_only_password@localhost:5432/drug_monitor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.init_db
      - run: python -m scripts.init_db
      - run: python -m pytest
